<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer - Research Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* 설정 영역 글자 크기 대폭 강화 */
        .label-style { font-size: 1.1rem; font-weight: 800; color: #1e293b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; display: block; }
        .input-style { font-size: 1.1rem; padding: 1rem; border-radius: 1rem; border: 2px solid #e2e8f0; width: 100%; outline: none; background: #fff; transition: all 0.2s; }
        .input-style:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        /* 카드 디자인 */
        .paper-card {
            background: white; border-radius: 1.5rem; padding: 2rem; border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; min-height: 400px;
        }
        .paper-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); border-color: #cbd5e1; }
        .priority-card { border-top: 10px solid #ef4444; background-color: #fffafb; }
        .normal-card { border-top: 10px solid #3b82f6; }
        
        .title-text { font-size: 1.25rem; font-weight: 800; color: #0f172a; line-height: 1.4; margin-bottom: 1rem; }
        .abstract-box {
            background: #f1f5f9; border-radius: 1rem; padding: 1.25rem;
            font-size: 0.95rem; color: #475569; line-height: 1.7;
            margin-top: auto; border: 1px solid #e2e8f0;
        }
        
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-14 text-center">
            <h1 class="text-7xl font-black text-slate-900 mb-4 tracking-tighter italic">Primer</h1>
            <p class="text-slate-500 font-bold text-lg tracking-widest uppercase">Multi-Source Research Dashboard</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-12">
            <!-- Sidebar: 큰 글씨와 명확한 입력창 -->
            <aside class="lg:col-span-1 bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-2xl h-fit sticky top-10">
                <h2 class="text-2xl font-black text-slate-800 mb-10 uppercase tracking-widest border-b-8 border-blue-500 pb-2">📋 검색 설정</h2>
                <div class="space-y-8">
                    <div>
                        <label class="label-style">PubMed Email</label>
                        <input type="email" id="pubmed_email" value="your@lab.ac.kr" class="input-style">
                    </div>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="label-style">검색 기간 (시작 ~ 종료)</label>
                            <div class="flex gap-2">
                                <input type="date" id="start_d" class="input-style text-sm">
                                <input type="date" id="end_d" class="input-style text-sm">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="label-style">관심 키워드</label>
                        <textarea id="kw" class="input-style h-40 leading-relaxed">PCR, NGS, Liquid Biopsy</textarea>
                    </div>
                    <div>
                        <label class="label-style text-red-600">최우선 순위</label>
                        <input type="text" id="prio" value="PowerChek" class="input-style border-red-200 bg-red-50 font-bold text-red-700">
                    </div>
                    <button onclick="startResearch()" class="w-full bg-slate-900 text-white font-black py-6 rounded-3xl shadow-2xl hover:bg-black transition-all text-xl active:scale-95">🚀 통합 분석 시작</button>
                </div>

                <!-- 발송 섹션 -->
                <div id="emailSection" class="hidden mt-14 pt-10 border-t-4 border-dashed border-slate-200">
                    <h2 class="text-xl font-black text-blue-600 mb-6 uppercase tracking-widest">✉️ 리포트 전달</h2>
                    <div class="space-y-4">
                        <input type="email" id="r_email" placeholder="수신자(교수님) 이메일" class="input-style">
                        <button onclick="copyAndNotify()" id="copyBtn" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl hover:bg-blue-700 shadow-xl transition-all text-lg">
                            📋 내용 복사 & 발송 준비
                        </button>
                        <div id="webmailButtons" class="hidden grid grid-cols-2 gap-3">
                            <button onclick="window.open('https://mail.google.com/mail/u/0/#inbox?compose=new')" class="bg-white border-2 border-slate-200 py-4 rounded-2xl font-bold flex justify-center items-center gap-2 hover:bg-slate-50">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" width="20"> Gmail
                            </button>
                            <button onclick="window.open('https://outlook.live.com/mail/0/deeplink/compose')" class="bg-white border-2 border-slate-200 py-4 rounded-2xl font-bold flex justify-center items-center gap-2 hover:bg-slate-50">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/d/df/Microsoft_Office_Outlook_%282018%E2%80%93present%29.svg" width="20"> Outlook
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="lg:col-span-3">
                <!-- Google Scholar Smart Discovery Section -->
                <div id="scholarEngine" class="mb-12 hidden">
                    <div class="bg-gradient-to-br from-blue-700 to-indigo-900 p-10 rounded-[3rem] shadow-2xl text-white">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-8">
                            <div class="text-center md:text-left">
                                <h3 class="text-3xl font-black mb-3 italic">Google Scholar Discovery</h3>
                                <p class="text-blue-100 text-lg font-medium">설정하신 키워드와 기간에 맞춰 학술 전문 자료를 구글에서 정밀 탐색합니다.</p>
                                <div class="flex gap-3 mt-6 flex-wrap justify-center md:justify-start">
                                    <span class="bg-blue-500/30 px-4 py-1 rounded-full text-xs font-bold border border-blue-400">PDF ONLY</span>
                                    <span class="bg-blue-500/30 px-4 py-1 rounded-full text-xs font-bold border border-blue-400">EXCLUDE CITATIONS</span>
                                    <span class="bg-blue-500/30 px-4 py-1 rounded-full text-xs font-bold border border-blue-400">ACADEMIC JOURNALS</span>
                                </div>
                            </div>
                            <div id="scholarLinks" class="flex flex-col gap-3 min-w-[250px]">
                                <!-- Links injected here -->
                            </div>
                        </div>
                    </div>
                </div>

                <div id="loading" class="hidden flex flex-col justify-center items-center py-40">
                    <div class="loader"></div>
                    <p class="mt-8 font-black text-slate-400 text-2xl tracking-tighter">바이오 학술 데이터를 동기화 중...</p>
                </div>

                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <!-- PubMed Cards -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // 초기 날짜 자동 설정
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('end_d').value = today;
        const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
        document.getElementById('start_d').value = lastMonth.toISOString().split('T')[0];

        let paperData = [];

        async function startResearch() {
            const email = document.getElementById('pubmed_email').value;
            const sDate = document.getElementById('start_d').value;
            const eDate = document.getElementById('end_d').value;
            const kw = document.getElementById('kw').value;
            const prio = document.getElementById('prio').value.toLowerCase();

            if(!email.includes('@')) return alert("PubMed 인증용 이메일을 입력하세요.");

            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            const emailSec = document.getElementById('emailSection');
            const scholarEngine = document.getElementById('scholarEngine');
            const scholarLinks = document.getElementById('scholarLinks');

            grid.innerHTML = "";
            loader.classList.remove('hidden');
            emailSec.classList.add('hidden');
            scholarEngine.classList.add('hidden');

            try {
                // 1. Google Scholar Deep Link 전략 생성
                const baseQ = `("Molecular Diagnostics") AND (${kw.split(',').join(' OR ')})`;
                const startYear = sDate.split('-')[0];
                const endYear = eDate.split('-')[0];
                
                // 검색 옵션들
                const scholarUrlDefault = `https://scholar.google.com/scholar?as_ylo=${startYear}&as_yhi=${endYear}&q=${encodeURIComponent(baseQ)}`;
                const scholarUrlPdf = `https://scholar.google.com/scholar?as_ylo=${startYear}&as_yhi=${endYear}&q=${encodeURIComponent(baseQ + ' filetype:pdf')}`;

                scholarLinks.innerHTML = `
                    <a href="${scholarUrlDefault}" target="_blank" class="w-full bg-white text-blue-800 font-black py-4 px-6 rounded-2xl text-center hover:bg-blue-50 transition-all shadow-lg">전체 학술자료 보기</a>
                    <a href="${scholarUrlPdf}" target="_blank" class="w-full bg-indigo-500 text-white font-black py-4 px-6 rounded-2xl text-center hover:bg-indigo-400 transition-all shadow-lg italic">PDF 전문(Full-Text) 검색</a>
                `;
                scholarEngine.classList.remove('hidden');

                // 2. PubMed 데이터 수집 (CORS 허용됨)
                const pmStart = sDate.replace(/-/g, '/');
                const pmEnd = eDate.replace(/-/g, '/');
                const url = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(baseQ)}&retmax=20&mindate=${pmStart}&maxdate=${pmEnd}&datetype=pdat&retmode=json&email=${email}`;
                
                const res = await fetch(url);
                const data = await res.json();
                const ids = data.esearchresult.idlist;

                if (ids && ids.length > 0) {
                    const fetchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${ids.join(',')}&rettype=abstract&retmode=xml`;
                    const fetchRes = await fetch(fetchUrl);
                    const xmlText = await fetchRes.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    const articles = xmlDoc.getElementsByTagName("PubmedArticle");

                    paperData = [];
                    for (let art of articles) {
                        const title = art.querySelector("ArticleTitle")?.textContent || "No Title";
                        const pmid = art.querySelector("PMID")?.textContent || "N/A";
                        const abstractFull = Array.from(art.querySelectorAll("AbstractText")).map(t => t.textContent).join(" ");
                        const abstractDisplay = abstractFull.length > 300 ? abstractFull.substring(0, 300) + "..." : abstractFull;

                        const authorInfo = art.querySelector("Author");
                        const author = authorInfo ? `${authorInfo.querySelector("LastName")?.textContent} ${authorInfo.querySelector("ForeName")?.textContent}` : "Unknown";
                        const aff = authorInfo?.querySelector("Affiliation")?.textContent || "N/A";
                        const journal = art.querySelector("Title")?.textContent || "Unknown Journal";
                        
                        const is_p = (title + abstractFull).toLowerCase().includes(prio);
                        paperData.push({ pmid, title, author, aff, journal, abstract: abstractDisplay, is_p, link: `https://pubmed.ncbi.nlm.nih.gov/${pmid}/` });
                    }

                    paperData.sort((a, b) => b.is_p - a.is_p);

                    paperData.forEach(p => {
                        const cardClass = p.is_p ? "priority-card" : "normal-card";
                        const badge = p.is_p ? `<span class="badge priority-badge">★ ${prio.toUpperCase()}</span>` : "";
                        grid.innerHTML += `
                            <div class="paper-card ${cardClass}">
                                <div class="flex justify-between items-start mb-6">
                                    <div><input type="checkbox" value="${p.pmid}" class="paper-check w-8 h-8 mr-4 cursor-pointer accent-blue-600"> ${badge}</div>
                                    <span class="text-xs text-slate-300 font-mono tracking-tighter">PMID: ${p.pmid}</span>
                                </div>
                                <div class="title-text">${p.title}</div>
                                <div class="text-lg font-bold text-slate-700 mb-1">👤 ${p.author}</div>
                                <div class="text-sm text-slate-400 mb-4 truncate">📍 ${p.aff}</div>
                                <div class="text-sm font-black text-blue-600 mb-6 uppercase tracking-widest">📖 ${p.journal}</div>
                                <div class="abstract-box">${p.abstract}</div>
                                <div class="mt-8 text-right"><a href="${p.link}" target="_blank" class="text-slate-400 font-black text-xs hover:text-blue-500 uppercase tracking-widest border-b-2 border-slate-100 pb-1">Read on PubMed →</a></div>
                            </div>
                        `;
                    });
                    emailSec.classList.remove('hidden');
                } else {
                    grid.innerHTML = "<div class='col-span-full py-20 text-center text-slate-400 font-bold text-xl'>PubMed 검색 결과가 없습니다. 구글 스콜라 결과를 확인해 보세요.</div>";
                }
            } catch (e) {
                console.error(e);
                alert("네트워크 통신 오류가 발생했습니다.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function copyAndNotify() {
            const selectedPmids = Array.from(document.querySelectorAll('.paper-check:checked')).map(c => c.value);
            const selected = paperData.filter(p => selectedPmids.includes(p.pmid));
            
            if(selected.length === 0) return alert("리포트에 포함할 논문을 선택해 주세요.");
            
            let text = `[Primer 분자진단 연구 리포트 - ${new Date().toLocaleDateString()}]\n\n`;
            selected.forEach(p => {
                text += `■ ${p.title}\n저자: ${p.author}\n저널: ${p.journal}\n링크: ${p.link}\n요약: ${p.abstract}\n\n`;
            });
            text += "--- 이 리포트는 Primer Research Intelligence를 통해 생성되었습니다 ---";
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✅ 복사 완료! 붙여넣기 준비됨";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                document.getElementById('webmailButtons').classList.remove('hidden');
                setTimeout(() => {
                    btn.innerText = "📋 내용 다시 복사하기";
                    btn.classList.replace('bg-green-600', 'bg-blue-600');
                }, 4000);
            });
        }
    </script>
</body>
</html>
