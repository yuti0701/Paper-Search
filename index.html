<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer - Bio Research Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* 사이드바 글자 크기 강화 */
        .label-style { font-size: 0.85rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.025em; }
        .input-style { font-size: 1rem; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; width: 100%; outline: none; }
        .input-style:focus { ring: 2px; ring-color: #3b82f6; border-color: #3b82f6; }

        .paper-card {
            background: white; border-radius: 12px; padding: 25px; border: 1px solid #e2e8f0;
            transition: all 0.3s ease; display: flex; flex-direction: column; min-height: 380px;
        }
        .paper-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .priority-card { border-top: 8px solid #ef4444; background-color: #fffcfc; }
        .normal-card { border-top: 8px solid #3b82f6; }
        
        .title-text { font-size: 1.1rem; font-weight: 800; color: #1e293b; line-height: 1.4; margin-bottom: 12px; }
        .abstract-box {
            background: #f1f5f9; border-radius: 8px; padding: 12px;
            font-size: 0.85rem; color: #475569; line-height: 1.6;
            margin-top: auto; border: 1px solid #e2e8f0;
        }
        
        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; margin-right: 5px; }
        .priority-badge { background: #fee2e2; color: #dc2626; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-6xl font-black text-slate-900 mb-2 italic tracking-tighter">🧪 Primer</h1>
            <p class="text-slate-500 font-bold text-sm tracking-widest uppercase">Research Intelligence Dashboard</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-10">
            <!-- Sidebar (폰트 크기 및 시인성 개선) -->
            <aside class="lg:col-span-1 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm h-fit sticky top-10">
                <h2 class="text-lg font-black text-slate-800 mb-8 uppercase tracking-widest border-b-4 border-blue-500 pb-2">📋 검색 설정</h2>
                <div class="space-y-6">
                    <div>
                        <label class="label-style">PubMed Email</label>
                        <input type="email" id="pubmed_email" value="your@lab.ac.kr" class="input-style mt-1">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="label-style">시작일</label>
                            <input type="date" id="start_d" class="input-style mt-1 text-sm">
                        </div>
                        <div>
                            <label class="label-style">종료일</label>
                            <input type="date" id="end_d" class="input-style mt-1 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="label-style">관심 키워드</label>
                        <textarea id="kw" class="input-style mt-1 h-32 leading-relaxed">PCR, NGS, Liquid Biopsy</textarea>
                    </div>
                    <div>
                        <label class="label-style text-red-600">최우선 순위</label>
                        <input type="text" id="prio" value="PowerChek" class="input-style mt-1 border-red-200 bg-red-50 font-bold text-red-700">
                    </div>
                    <button onclick="startResearch()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-2xl hover:bg-black transition-all text-lg active:scale-95">🚀 리포트 생성</button>
                </div>

                <!-- 발송 섹션 -->
                <div id="emailSection" class="hidden mt-12 pt-8 border-t-2 border-dashed border-slate-200">
                    <h2 class="text-base font-black text-blue-600 mb-5 uppercase tracking-widest">✉️ 리포트 전달</h2>
                    <div class="space-y-4">
                        <button onclick="copyAndNotify()" id="copyBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 shadow-lg transition-all">
                            📋 내용 복사 & 발송 준비
                        </button>
                        <div id="webmailButtons" class="hidden space-y-3">
                            <button onclick="window.open('https://mail.google.com/mail/u/0/#inbox?compose=new')" class="w-full bg-white border-2 border-slate-200 text-slate-700 py-3 rounded-xl text-sm font-bold hover:bg-slate-50 flex items-center justify-center gap-2">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" width="16"> Gmail 열기
                            </button>
                            <button onclick="window.open('https://outlook.live.com/mail/0/deeplink/compose')" class="w-full bg-white border-2 border-slate-200 text-slate-700 py-3 rounded-xl text-sm font-bold hover:bg-slate-50 flex items-center justify-center gap-2">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/d/df/Microsoft_Office_Outlook_%282018%E2%80%93present%29.svg" width="16"> Outlook 열기
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="lg:col-span-3">
                <div id="loading" class="hidden flex flex-col justify-center items-center py-40">
                    <div class="loader"></div>
                    <p class="mt-6 font-black text-slate-400 tracking-tighter">분자진단 데이터를 통합 분석 중...</p>
                </div>

                <!-- Google Scholar 전용 카드 (상단 고정 예정) -->
                <div id="scholarCardContainer" class="mb-8 hidden"></div>

                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </main>
        </div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('end_d').value = today;
        const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
        document.getElementById('start_d').value = lastMonth.toISOString().split('T')[0];

        let paperData = [];

        async function startResearch() {
            const email = document.getElementById('pubmed_email').value;
            const sDate = document.getElementById('start_d').value;
            const eDate = document.getElementById('end_d').value;
            const kw = document.getElementById('kw').value;
            const prio = document.getElementById('prio').value.toLowerCase();

            if(!email.includes('@')) return alert("이메일을 입력하세요.");

            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            const emailSec = document.getElementById('emailSection');
            const scholarContainer = document.getElementById('scholarCardContainer');

            grid.innerHTML = "";
            scholarContainer.innerHTML = "";
            loader.classList.remove('hidden');
            emailSec.classList.add('hidden');

            try {
                // 1. Google Scholar 검색 카드 생성
                const scholarQuery = `("Molecular Diagnostics") AND (${kw.split(',').join(' OR ')})`;
                const startYear = sDate.split('-')[0];
                const endYear = eDate.split('-')[0];
                const scholarUrl = `https://scholar.google.com/scholar?as_ylo=${startYear}&as_yhi=${endYear}&q=${encodeURIComponent(scholarQuery)}`;

                scholarContainer.innerHTML = `
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 rounded-3xl shadow-xl text-white flex flex-col md:flex-row items-center justify-between gap-6">
                        <div>
                            <h3 class="text-2xl font-black mb-2">Google Scholar 연동 완료</h3>
                            <p class="text-blue-100 font-medium">PubMed 외의 추가 학술 자료를 Google Scholar에서 확인하세요.</p>
                        </div>
                        <a href="${scholarUrl}" target="_blank" class="bg-white text-blue-700 font-black px-8 py-4 rounded-2xl hover:bg-blue-50 transition-all whitespace-nowrap">
                            Scholar 결과 보기 →
                        </a>
                    </div>
                `;
                scholarContainer.classList.remove('hidden');

                // 2. PubMed 데이터 수집
                const pubmedSDate = sDate.replace(/-/g, '/');
                const pubmedEDate = eDate.replace(/-/g, '/');
                const query = `("Molecular Diagnostics") AND (${kw.split(',').join(' OR ')})`;
                const url = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(query)}&retmax=20&mindate=${pubmedSDate}&maxdate=${pubmedEDate}&datetype=pdat&retmode=json&email=${email}`;
                
                const res = await fetch(url);
                const data = await res.json();
                const ids = data.esearchresult.idlist;

                if (ids && ids.length > 0) {
                    const fetchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${ids.join(',')}&rettype=abstract&retmode=xml`;
                    const fetchRes = await fetch(fetchUrl);
                    const xmlText = await fetchRes.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    const articles = xmlDoc.getElementsByTagName("PubmedArticle");

                    paperData = [];
                    for (let art of articles) {
                        const title = art.querySelector("ArticleTitle")?.textContent || "No Title";
                        const pmid = art.querySelector("PMID")?.textContent || "N/A";
                        const abstractFull = Array.from(art.querySelectorAll("AbstractText")).map(t => t.textContent).join(" ");
                        const abstractDisplay = abstractFull.length > 300 ? abstractFull.substring(0, 300) + "..." : abstractFull;

                        const authorInfo = art.querySelector("Author");
                        const author = authorInfo ? `${authorInfo.querySelector("LastName")?.textContent} ${authorInfo.querySelector("ForeName")?.textContent}` : "Unknown";
                        const aff = authorInfo?.querySelector("Affiliation")?.textContent || "N/A";
                        const journal = art.querySelector("Title")?.textContent || "Unknown Journal";
                        
                        const is_p = (title + abstractFull).toLowerCase().includes(prio);
                        paperData.push({ pmid, title, author, aff, journal, abstract: abstractDisplay, is_p, link: `https://pubmed.ncbi.nlm.nih.gov/${pmid}/` });
                    }

                    paperData.sort((a, b) => b.is_p - a.is_p);

                    paperData.forEach(p => {
                        const cardClass = p.is_p ? "priority-card" : "normal-card";
                        const badge = p.is_p ? `<span class="badge priority-badge">★ ${prio.toUpperCase()}</span>` : "";
                        grid.innerHTML += `
                            <div class="paper-card ${cardClass}">
                                <div class="flex justify-between items-start mb-4">
                                    <div><input type="checkbox" value="${p.pmid}" class="paper-check w-6 h-6 mr-3 cursor-pointer accent-blue-600"> ${badge}</div>
                                    <span class="text-[10px] text-slate-300 font-mono italic">PMID: ${p.pmid}</span>
                                </div>
                                <div class="title-text">${p.title}</div>
                                <div class="text-[0.9rem] font-bold text-slate-700">👤 ${p.author}</div>
                                <div class="text-[0.75rem] text-slate-400 mb-3 truncate">📍 ${p.aff}</div>
                                <div class="text-[0.85rem] font-black text-blue-600 mb-5 uppercase tracking-tighter">📖 ${p.journal}</div>
                                <div class="abstract-box">${p.abstract}</div>
                                <div class="mt-6 text-right"><a href="${p.link}" target="_blank" class="text-slate-400 font-black text-[11px] hover:text-blue-500 uppercase tracking-widest border-b-2 border-slate-100">Full Text →</a></div>
                            </div>
                        `;
                    });
                    emailSec.classList.remove('hidden');
                } else {
                    grid.innerHTML = "<div class='col-span-full py-20 text-center text-slate-400 font-bold'>PubMed 검색 결과가 없습니다.</div>";
                }
            } catch (e) {
                console.error(e);
                alert("데이터 수집 중 오류가 발생했습니다.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function copyAndNotify() {
            const selectedPmids = Array.from(document.querySelectorAll('.paper-check:checked')).map(c => c.value);
            const selected = paperData.filter(p => selectedPmids.includes(p.pmid));
            
            if(selected.length === 0) return alert("논문을 선택해 주세요.");
            
            let text = `[Primer 분자진단 최신 연구 리포트 - ${new Date().toLocaleDateString()}]\n\n`;
            selected.forEach(p => {
                text += `■ ${p.title}\n저자: ${p.author}\n저널: ${p.journal}\n링크: ${p.link}\n요약: ${p.abstract}\n\n`;
            });
            text += "--- 본 리포트는 Primer 시스템을 통해 수집되었습니다 ---";
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✅ 내용 복사 완료!";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                document.getElementById('webmailButtons').classList.remove('hidden');
                setTimeout(() => {
                    btn.innerText = "📋 내용 다시 복사하기";
                    btn.classList.replace('bg-green-600', 'bg-blue-600');
                }, 3000);
            });
        }
    </script>
</body>
</html>
