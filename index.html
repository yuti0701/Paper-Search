<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer - Bio Research Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-5xl font-black text-slate-900 mb-2 italic">🧪 Primer</h1>
            <p class="text-slate-500 font-medium">Molecular Diagnostics Research Intelligence Hub</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar: Python 코드의 Sidebar와 동일하게 구성 -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit sticky top-10">
                <h2 class="text-sm font-bold text-slate-800 mb-6 uppercase tracking-widest border-b pb-2">📋 검색 설정</h2>
                <div class="space-y-5">
                    <div>
                        <label class="label-text">PubMed Email</label>
                        <input type="email" id="pubmed_email" value="your@lab.ac.kr" class="input-field">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="label-text">시작일</label>
                            <input type="date" id="start_d" class="input-field text-[10px]">
                        </div>
                        <div>
                            <label class="label-text">종료일</label>
                            <input type="date" id="end_d" class="input-field text-[10px]">
                        </div>
                    </div>
                    <div>
                        <label class="label-text">연구 분야</label>
                        <input type="text" id="domain" value="Molecular Diagnostics" class="input-field">
                    </div>
                    <div>
                        <label class="label-text">관심 키워드</label>
                        <textarea id="kw" class="input-field h-24">PCR, NGS, Liquid Biopsy</textarea>
                    </div>
                    <div>
                        <label class="label-text text-red-500">강조 키워드</label>
                        <input type="text" id="prio" value="PowerChek" class="input-field border-red-200 bg-red-50 font-bold text-red-700">
                    </div>
                    <div>
                        <label class="label-text">조회 수: <span id="limitVal">20</span></label>
                        <input type="range" id="limit" min="5" max="50" value="20" class="w-full mt-2" oninput="document.getElementById('limitVal').innerText=this.value">
                    </div>
                    <button onclick="startResearch()" class="btn-primary w-full py-4 shadow-xl">🚀 리포트 생성</button>
                </div>

                <!-- 이메일 발송 섹션 (Python UI 이식) -->
                <div id="emailSection" class="hidden mt-10 pt-6 border-t border-slate-200">
                    <h2 class="text-sm font-bold text-slate-800 mb-4 uppercase tracking-widest">✉️ 리포트 발송</h2>
                    <div class="space-y-4">
                        <input type="email" id="s_user" placeholder="나의 Gmail" class="input-field">
                        <p class="text-[9px] text-slate-400">⚠️ 정적 페이지에서는 텍스트 복사 및 메일 앱 연결을 지원합니다.</p>
                        <input type="email" id="r_email" placeholder="수신자(교수님) 이메일" class="input-field">
                        <button onclick="sendViaMailApp()" class="btn-secondary w-full py-3">📧 이메일 앱으로 발송</button>
                        <button onclick="copyToClipboard()" class="bg-slate-100 text-slate-700 w-full py-2 rounded-xl text-xs font-bold hover:bg-slate-200">📋 리포트 텍스트 복사</button>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="lg:col-span-3">
                <div id="loading" class="hidden flex flex-col justify-center items-center py-32">
                    <div class="loader"></div>
                    <p class="mt-4 font-bold text-slate-400">PubMed 데이터를 분석 중입니다...</p>
                </div>

                <div id="infoMessage" class="mb-6 p-4 bg-blue-50 text-blue-700 rounded-xl text-sm font-medium border border-blue-100">
                    💡 리포트 생성 버튼을 눌러 연구 자료를 불러오세요.
                </div>

                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 논문 카드가 이곳에 생성됩니다 -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // 날짜 초기화
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('end_d').value = today;
        const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
        document.getElementById('start_d').value = lastMonth.toISOString().split('T')[0];

        let paperData = [];

        async function startResearch() {
            const email = document.getElementById('pubmed_email').value;
            const sDate = document.getElementById('start_d').value.replace(/-/g, '/');
            const eDate = document.getElementById('end_d').value.replace(/-/g, '/');
            const domain = document.getElementById('domain').value;
            const kw = document.getElementById('kw').value;
            const prio = document.getElementById('prio').value.toLowerCase();
            const limit = document.getElementById('limit').value;

            if(!email.includes('@')) return alert("유효한 이메일을 입력하세요.");

            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loading');
            const info = document.getElementById('infoMessage');
            const emailSec = document.getElementById('emailSection');

            grid.innerHTML = "";
            loader.classList.remove('hidden');
            info.innerHTML = "💡 리포트에 포함할 논문을 선택하세요.";
            emailSec.classList.add('hidden');

            try {
                const query = `("${domain}") AND (${kw.split(',').join(' OR ')})`;
                const url = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(query)}&retmax=${limit}&mindate=${sDate}&maxdate=${eDate}&datetype=pdat&retmode=json&email=${email}`;
                
                const res = await fetch(url);
                const data = await res.json();
                const ids = data.esearchresult.idlist;

                if (!ids || ids.length === 0) {
                    loader.classList.add('hidden');
                    return alert("결과가 없습니다.");
                }

                const fetchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${ids.join(',')}&rettype=abstract&retmode=xml`;
                const fetchRes = await fetch(fetchUrl);
                const xmlText = await fetchRes.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const articles = xmlDoc.getElementsByTagName("PubmedArticle");

                paperData = [];
                for (let art of articles) {
                    const title = art.querySelector("ArticleTitle")?.textContent || "No Title";
                    const pmid = art.querySelector("PMID")?.textContent || "N/A";
                    const abstract = Array.from(art.querySelectorAll("AbstractText")).map(t => t.textContent).join(" ");
                    const authorInfo = art.querySelector("Author");
                    const author = authorInfo ? `${authorInfo.querySelector("LastName")?.textContent} ${authorInfo.querySelector("ForeName")?.textContent}` : "Unknown";
                    const aff = authorInfo?.querySelector("Affiliation")?.textContent || "N/A";
                    const journal = art.querySelector("Title")?.textContent || "Unknown Journal";
                    
                    const is_p = (title + abstract).toLowerCase().includes(prio);
                    paperData.push({ pmid, title, author, aff, journal, abstract, is_p, link: `https://pubmed.ncbi.nlm.nih.gov/${pmid}/` });
                }

                paperData.sort((a, b) => b.is_p - a.is_p);

                paperData.forEach(p => {
                    const cardClass = p.is_p ? "priority-card" : "normal-card";
                    const badge = p.is_p ? `<span class="badge priority-badge">★ ${prio.toUpperCase()}</span>` : "";
                    grid.innerHTML += `
                        <div class="paper-card ${cardClass}">
                            <div class="flex justify-between items-start mb-4">
                                <div><input type="checkbox" value="${p.pmid}" class="paper-check w-5 h-5 mr-2"> ${badge}</div>
                                <span class="text-[10px] text-slate-300 font-mono">PMID: ${p.pmid}</span>
                            </div>
                            <div class="title-text">${p.title}</div>
                            <div class="author-info">👤 ${p.author}</div>
                            <div class="aff-info">📍 ${p.aff.substring(0, 100)}...</div>
                            <div class="journal-info">📖 ${p.journal}</div>
                            <div class="abstract-box">${p.abstract.substring(0, 400)}...</div>
                            <div class="mt-4 text-right">
                                <a href="${p.link}" target="_blank" class="text-blue-600 font-bold text-xs">원문 링크</a>
                            </div>
                        </div>
                    `;
                });
                emailSec.classList.remove('hidden');
            } catch (e) {
                alert("데이터 수집 중 오류가 발생했습니다.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function getSelectedPapers() {
            const selectedPmids = Array.from(document.querySelectorAll('.paper-check:checked')).map(c => c.value);
            return paperData.filter(p => selectedPmids.includes(p.pmid));
        }

        function copyToClipboard() {
            const selected = getSelectedPapers();
            if(selected.length === 0) return alert("논문을 선택해주세요.");
            
            let text = `[Primer 리포트 - ${new Date().toLocaleDateString()}]\n\n`;
            selected.forEach(p => {
                text += `■ ${p.title}\n저자: ${p.author}\n링크: ${p.link}\n\n`;
            });
            
            navigator.clipboard.writeText(text).then(() => alert("리포트 내용이 복사되었습니다. 메일에 붙여넣으세요!"));
        }

        function sendViaMailApp() {
            const selected = getSelectedPapers();
            const r_email = document.getElementById('r_email').value;
            if(selected.length === 0) return alert("논문을 선택해주세요.");
            if(!r_email) return alert("수신자 이메일을 입력하세요.");

            let body = "교수님, 선택하신 최신 연구 리포트입니다.\n\n";
            selected.forEach(p => {
                body += `■ ${p.title}\n저자: ${p.author}\n원문: ${p.link}\n\n`;
            });

            window.location.href = `mailto:${r_email}?subject=[Primer Report] 최신 연구 요약&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
