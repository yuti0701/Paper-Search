<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer - Bio Research Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .paper-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; transition: all 0.3s ease; min-height: 420px; }
        .paper-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .priority-card { border-top: 8px solid #ef4444; background: #fffcfc; }
        .normal-card { border-top: 8px solid #3b82f6; }
        .title-text { font-size: 1.2rem; font-weight: 800; color: #1e293b; line-height: 1.4; margin-bottom: 12px; }
        .author-info { font-size: 0.95rem; font-weight: 700; color: #334155; margin-bottom: 4px; }
        .aff-info { font-size: 0.8rem; color: #64748b; line-height: 1.5; margin-bottom: 12px; }
        .journal-info { font-size: 0.85rem; color: #2563eb; font-weight: 700; margin-bottom: 4px; }
        .date-info { font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; }
        .abstract-box { background: #f1f5f9; border-radius: 8px; padding: 15px; font-size: 0.9rem; color: #475569; line-height: 1.6; margin-top: auto; border: 1px solid #e2e8f0; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-right: 5px; margin-bottom: 10px; }
        .type-badge { background: #eef2f7; color: #475569; border: 1px solid #cbd5e1; }
        .priority-badge { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .pmid-text { font-family: monospace; font-size: 0.75rem; color: #94a3b8; float: right; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #pdf-export-area { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-6xl font-black text-slate-900 mb-2 italic">Primer</h1>
            <p class="text-slate-500 font-medium">Molecular Diagnostics Research Hub</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar (Python Sidebar 복제) -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit sticky top-10">
                <h2 class="text-sm font-bold text-slate-800 mb-6 uppercase tracking-widest">📋 리서치 설정</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase">PubMed Email</label>
                        <input type="email" id="email" value="your@lab.ac.kr" class="w-full mt-1 p-2.5 border rounded-xl text-sm outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">시작일</label>
                            <input type="date" id="startDate" class="w-full mt-1 p-2 border rounded-xl text-[10px]">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">종료일</label>
                            <input type="date" id="endDate" class="w-full mt-1 p-2 border rounded-xl text-[10px]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase">기본 도메인</label>
                        <input type="text" id="baseDomain" value="Molecular Diagnostics" class="w-full mt-1 p-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase">관심 키워드</label>
                        <textarea id="interests" class="w-full mt-1 p-2 border rounded-xl text-sm h-24">PCR, NGS, Liquid Biopsy</textarea>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-red-400 uppercase">최우선 강조</label>
                        <input type="text" id="priorityK" value="PowerChek" class="w-full mt-1 p-2 border border-red-100 bg-red-50 text-red-700 font-bold rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase">조회수: <span id="limitVal">20</span></label>
                        <input type="range" id="limit" min="5" max="50" value="20" class="w-full mt-2" oninput="document.getElementById('limitVal').innerText=this.value">
                    </div>
                    <button onclick="startSearch()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-all">🚀 리포트 생성</button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="lg:col-span-3">
                <div id="metricArea" class="grid grid-cols-3 gap-4 mb-8 hidden">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">총 검색 결과</p>
                        <p id="statTotal" class="text-2xl font-black text-slate-800">0</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-t-8 border-t-red-500 border-slate-200 text-center">
                        <p class="text-[10px] font-bold text-red-400 uppercase">강조 논문</p>
                        <p id="statPriority" class="text-2xl font-black text-red-600">0</p>
                    </div>
                    <button onclick="exportSelectedToPDF()" class="bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700">📄 PDF 저장</button>
                </div>

                <div id="loading" class="hidden flex flex-col justify-center items-center py-20">
                    <div class="loader"></div>
                    <span class="mt-4 font-bold text-slate-400 animate-pulse">데이터를 수집 중입니다...</span>
                </div>

                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </main>
        </div>
    </div>

    <!-- PDF용 숨겨진 영역 -->
    <div id="pdf-export-area"></div>

    <script>
        // 초기 날짜 설정
        const now = new Date();
        document.getElementById('endDate').value = now.toISOString().split('T')[0];
        const last = new Date(); last.setMonth(now.getMonth() - 1);
        document.getElementById('startDate').value = last.toISOString().split('T')[0];

        let paperList = [];

        async function startSearch() {
            const email = document.getElementById('email').value;
            const startDate = document.getElementById('startDate').value.replace(/-/g, '/');
            const endDate = document.getElementById('endDate').value.replace(/-/g, '/');
            const domain = document.getElementById('baseDomain').value;
            const kws = document.getElementById('interests').value;
            const prio = document.getElementById('priorityK').value.toLowerCase();
            const limit = document.getElementById('limit').value;

            if(!email.includes('@')) return alert("유효한 이메일을 입력하세요.");

            const grid = document.getElementById('resultsGrid');
            const loading = document.getElementById('loading');
            const metrics = document.getElementById('metricArea');

            grid.innerHTML = "";
            loading.classList.remove('hidden');
            metrics.classList.add('hidden');

            try {
                const query = `("${domain}") AND (${kws.split(',').join(' OR ')})`;
                const url = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(query)}&retmax=${limit}&mindate=${startDate}&maxdate=${endDate}&datetype=pdat&retmode=json&email=${email}`;
                
                const res = await fetch(url);
                const searchData = await res.json();
                const ids = searchData.esearchresult.idlist;

                if (!ids || ids.length === 0) {
                    loading.classList.add('hidden');
                    return alert("결과가 없습니다.");
                }

                const fetchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${ids.join(',')}&rettype=abstract&retmode=xml`;
                const fetchRes = await fetch(fetchUrl);
                const xmlText = await fetchRes.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const articles = xmlDoc.getElementsByTagName("PubmedArticle");

                paperList = [];
                let prioCount = 0;

                for (let art of articles) {
                    const title = art.querySelector("ArticleTitle")?.textContent || "No Title";
                    const pmid = art.querySelector("PMID")?.textContent || "N/A";
                    const abstract = Array.from(art.querySelectorAll("AbstractText")).map(t => t.textContent).join(" ");
                    const authorInfo = art.querySelector("Author");
                    const author = authorInfo ? `${authorInfo.querySelector("LastName")?.textContent} ${authorInfo.querySelector("ForeName")?.textContent}` : "Unknown";
                    const aff = authorInfo?.querySelector("Affiliation")?.textContent || "N/A";
                    const journal = art.querySelector("Title")?.textContent || "Unknown Journal";
                    const pubDate = art.querySelector("PubDate Year")?.textContent || "";
                    const type = art.querySelector("PublicationType")?.textContent || "Article";
                    
                    const isPrio = (title + abstract).toLowerCase().includes(prio);
                    if(isPrio) prioCount++;

                    paperList.push({ pmid, title, author, aff, journal, pubDate, type, abstract, isPrio, link: `https://pubmed.ncbi.nlm.nih.gov/${pmid}/` });
                }

                paperList.sort((a, b) => b.isPrio - a.isPrio);

                document.getElementById('statTotal').innerText = paperList.length;
                document.getElementById('statPriority').innerText = prioCount;
                metrics.classList.remove('hidden');

                paperList.forEach(p => {
                    const cardClass = p.isPrio ? "priority-card" : "normal-card";
                    const pBadge = p.isPrio ? `<span class="badge priority-badge">★ ${prio.toUpperCase()}</span>` : "";
                    grid.innerHTML += `
                        <div class="paper-card ${cardClass}">
                            <div class="flex justify-between items-start">
                                <div><input type="checkbox" value="${p.pmid}" class="mr-2 pdf-check"> ${pBadge}<span class="badge type-badge">${p.type}</span></div>
                                <span class="pmid-text">PMID: ${p.pmid}</span>
                            </div>
                            <div class="title-text">${p.title}</div>
                            <div class="author-info">👤 ${p.author}</div>
                            <div class="aff-info">📍 ${p.aff}</div>
                            <div class="journal-info">📖 ${p.journal}</div>
                            <div class="date-info">📅 ${p.pubDate}</div>
                            <div class="abstract-box"><b>[Abstract]</b><br>${p.abstract.substring(0, 550)}...</div>
                            <div class="text-right mt-4"><a href="${p.link}" target="_blank" class="text-blue-600 font-bold text-xs">View on PubMed →</a></div>
                        </div>
                    `;
                });
            } catch (e) {
                alert("오류 발생");
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function exportSelectedToPDF() {
            const selected = Array.from(document.querySelectorAll('.pdf-check:checked')).map(c => c.value);
            if(selected.length === 0) return alert("논문을 선택하세요.");
            const area = document.getElementById('pdf-export-area');
            area.innerHTML = `<h1 style="text-align:center;">Primer Research Report</h1>`;
            selected.forEach(id => {
                const p = paperList.find(x => x.pmid === id);
                area.innerHTML += `<div style="margin-bottom:30px; border-bottom:1px solid #eee; padding-bottom:20px;">
                    <h3>${p.title}</h3>
                    <p><b>Author:</b> ${p.author} | <b>Journal:</b> ${p.journal}</p>
                    <p>${p.abstract}</p>
                </div>`;
            });
            area.style.display = 'block';
            await html2pdf().set({ margin: 10, filename: 'Primer_Report.pdf' }).from(area).save();
            area.style.display = 'none';
        }
    </script>
</body>
</html>
